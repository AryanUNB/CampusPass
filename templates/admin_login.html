<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c8102e">
    <title>Admin Login | CampusPass</title>
    <style>
        :root {
            --red: #c8102e;
            --red-dark: #a20d25;
            --ink: #17191c;
            --muted: #656a70;
            --line: #e7e5e2;
            --paper: #f5f4f1;
            --white: #fff;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .top-rule { height: 5px; background: var(--red); }

        header {
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 max(6vw, calc((100vw - 1200px) / 2));
            border-bottom: 1px solid var(--line);
            background: var(--white);
        }

        .brand {
            color: var(--ink);
            font-size: 18px;
            font-weight: 760;
            text-decoration: none;
        }

        .brand span { color: var(--red); }

        header a:last-child {
            color: var(--red);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        main {
            width: min(420px, calc(100% - 36px));
            margin: 10vh auto;
            padding: 36px;
            border: 1px solid #e9e7e4;
            border-radius: 14px;
            background: var(--white);
            box-shadow: 0 22px 60px #19191912;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--red);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }

        .intro {
            margin: 10px 0 24px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .message {
            margin: 0 0 18px;
            padding: 12px 14px;
            border: 1px solid #efc7c9;
            border-radius: 8px;
            background: #fff1f1;
            color: #982631;
            font-size: 13px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 0 13px;
            border: 1px solid #d8d8d8;
            border-radius: 7px;
            font: inherit;
        }

        input:focus {
            border-color: var(--red);
            outline: 3px solid #c8102e1a;
        }

        button {
            width: 100%;
            min-height: 49px;
            margin-top: 24px;
            border: 1px solid var(--red);
            border-radius: 7px;
            background: var(--red);
            color: var(--white);
            font: inherit;
            font-size: 14px;
            font-weight: 750;
            cursor: pointer;
        }

        button:hover { border-color: var(--red-dark); background: var(--red-dark); }
    </style>
</head>
<body>
    <div class="top-rule"></div>
    <header>
        <a class="brand" href="/">Campus<span>Pass</span></a>
        <a href="/">Student portal</a>
    </header>
    <main>
        <p class="eyebrow">CampusPass administration</p>
        <h1>Admin login</h1>
        <p class="intro">Sign in to manage UNB student records and bus-pass claims.</p>

        {% if message %}
            <p class="message" role="alert">{{ message }}</p>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="email">Admin email</label>
            <input type="email" id="email" name="email" autocomplete="username"
                   maxlength="254" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" maxlength="256" required>

            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
